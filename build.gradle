plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.mahoraga.wheel'
version = '1.8.0'
base { archivesName = 'mahoraga_wheel-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.256'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        // Tells the game which sources belong to which mod; without this
        // the main mod is silently missing from runClient/runServer.
        'mahoraga_wheel' {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        // Do not probe the Curios server for every Minecraft/NeoForge dependency.
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

dependencies {
    implementation 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Local JDKs are tools, not project sources.
idea { module { excludeDirs += file('.tools') } }
